name: CI Pipeline

on:
  push:
    branches:
      - main
jobs: 
  build:
    runs-on: unbuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v4

      - name: set up NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 22
        
      - name: Install dependecies
        run: npm install

      - name: Run test
        run: npm test 